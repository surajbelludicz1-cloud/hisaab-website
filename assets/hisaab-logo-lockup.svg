    <path d="M42 49 C58 40 90 40 106 48" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-opacity="0.68"/>
    <ellipse cx="44" cy="92" rx="7.5" ry="4.5" fill="#FF7E95" fill-opacity="0.52"/>
