<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="hgSproutMascotTitle">
  <title id="hgSproutMascotTitle">Hisaab.Guru Cute Glossy 3D Sprout Mascot</title>
  <defs>
    <!-- Soft 3D Squircle Body Gradient: Lime Crown -> Creamy Face -> Soft Ambient Base -->
    <linearGradient id="hgBodyGrad" x1="25%" y1="0%" x2="75%" y2="100%">
      <stop offset="0%" stop-color="#9EFF5A"/>
      <stop offset="22%" stop-color="#4CE048"/>
      <stop offset="42%" stop-color="#E9FBD7"/>
      <stop offset="62%" stop-color="#FFFDF8"/>
      <stop offset="88%" stop-color="#F6F9EC"/>
      <stop offset="100%" stop-color="#CFE8B4"/>
    </linearGradient>

    <!-- Inner 3D Rim Glow -->
    <radialGradient id="hgFaceGlow" cx="50%" cy="62%" r="48%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.98"/>
      <stop offset="72%" stop-color="#FFFDF7" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#DDF5C3" stop-opacity="0"/>
    </radialGradient>

    <!-- Glossy Sprout Leaf Left Gradient -->
    <linearGradient id="hgLeafLeft" x1="15%" y1="5%" x2="85%" y2="95%">
      <stop offset="0%" stop-color="#B6FF6C"/>
      <stop offset="48%" stop-color="#3BD63F"/>
      <stop offset="100%" stop-color="#12872E"/>
    </linearGradient>

    <!-- Glossy Sprout Leaf Right Gradient -->
    <linearGradient id="hgLeafRight" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#C2FF78"/>
      <stop offset="45%" stop-color="#44DF44"/>
      <stop offset="100%" stop-color="#149132"/>
    </linearGradient>

    <!-- Glossy Puffy 3D Hand Gradient -->
    <radialGradient id="hgHandGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="68%" stop-color="#F3F6EE"/>
      <stop offset="100%" stop-color="#CFD9C8"/>
    </radialGradient>

    <!-- Golden Sparkle Gradient -->
    <linearGradient id="hgGoldSparkle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="55%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>

    <!-- Soft Rosy Blush Filter -->
    <filter id="hgBlushBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.8"/>
    </filter>

    <!-- 3D Toy Drop Shadow -->
    <filter id="hgSoftShadow" x="-20%" y="-15%" width="140%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#0A2916" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Floating 4-Point Gold Sparkles -->
  <path d="M22 36 Q22 44 14 44 Q22 44 22 52 Q22 44 30 44 Q22 44 22 36 Z" fill="url(#hgGoldSparkle)"/>
  <path d="M140 28 Q140 34 134 34 Q140 34 140 40 Q140 34 146 34 Q140 34 140 28 Z" fill="url(#hgGoldSparkle)"/>

  <g filter="url(#hgSoftShadow)" transform="rotate(-3 80 86)">
    <!-- Sprout Stem Shadow -->
    <ellipse cx="78" cy="44" rx="18" ry="5" fill="#137A2B" fill-opacity="0.35"/>

    <!-- Left Plump Glossy Sprout Leaf -->
    <g transform="translate(56, 26) rotate(-28)">
      <path d="M18 22 C4 22 -4 10 4 2 C12 -6 26 2 22 20 Z" fill="url(#hgLeafLeft)"/>
      <path d="M7 5 C11 1 17 4 17 11" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-opacity="0.72"/>
    </g>

    <!-- Right Plump Glossy Sprout Leaf -->
    <g transform="translate(75, 10) rotate(22)">
      <path d="M4 32 C-4 14 8 -2 24 0 C38 2 40 20 12 34 Z" fill="url(#hgLeafRight)"/>
      <path d="M12 6 C20 2 29 5 27 13" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-opacity="0.78"/>
      <path d="M8 29 Q17 17 26 8" fill="none" stroke="#127C2B" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.35"/>
    </g>

    <!-- Main Soft Glossy 3D Squircle Head -->
    <rect x="28" y="38" width="104" height="92" rx="42" fill="url(#hgBodyGrad)" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.65"/>
    <ellipse cx="80" cy="90" rx="44" ry="34" fill="url(#hgFaceGlow)"/>

    <!-- Top Specular Glassy Highlight on Crown -->
    <path d="M44 52 C60 43 96 42 114 51" fill="none" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-opacity="0.68"/>
    <circle cx="38" cy="57" r="2.8" fill="#FFFFFF" fill-opacity="0.7"/>

    <!-- Soft Rosy Pink Blush Cheeks -->
    <ellipse cx="47" cy="98" rx="8.5" ry="5" fill="#FF7E95" fill-opacity="0.55" filter="url(#hgBlushBlur)"/>
    <ellipse cx="113" cy="98" rx="8.5" ry="5" fill="#FF7E95" fill-opacity="0.55" filter="url(#hgBlushBlur)"/>

    <!-- Left Big Glossy Eye with Double Catchlights -->
    <g>
      <ellipse cx="59" cy="84" rx="9.5" ry="11" fill="#181517"/>
      <circle cx="55.5" cy="79.5" r="3.8" fill="#FFFFFF"/>
      <circle cx="62.2" cy="88.2" r="1.8" fill="#FFFFFF" fill-opacity="0.9"/>
    </g>

    <!-- Right Cute Playful Winking Eye (^) -->
    <path d="M91 85 Q101 73 110 85" fill="none" stroke="#181517" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Cute Happy Open Smile with Pink Tongue -->
    <g>
      <path d="M71 95 Q80 97 89 95 C91 107 86 114 80 114 C74 114 69 107 71 95 Z" fill="#281317"/>
      <path d="M73.5 106 Q80 101 86.5 106 C85.5 111.5 83 113.8 80 113.8 C77 113.8 74.5 111.5 73.5 106 Z" fill="#FF6B83"/>
    </g>

    <!-- Cute Floating 3D Puffy Left Hand (Thumbs Up / Wave) -->
    <g transform="translate(10, 94) rotate(-14)">
      <ellipse cx="14" cy="18" rx="12" ry="10.5" fill="url(#hgHandGrad)"/>
      <rect x="10" y="3" width="7.5" height="12" rx="3.7" fill="url(#hgHandGrad)"/>
      <circle cx="11" cy="14" r="3" fill="#FFFFFF" fill-opacity="0.85"/>
    </g>

    <!-- Cute Floating 3D Puffy Right Hand (Thumbs Up) -->
    <g transform="translate(124, 92) rotate(16)">
      <ellipse cx="14" cy="18" rx="12" ry="10.5" fill="url(#hgHandGrad)"/>
      <rect x="10" y="3" width="7.5" height="12" rx="3.7" fill="url(#hgHandGrad)"/>
      <circle cx="12" cy="14" r="3" fill="#FFFFFF" fill-opacity="0.85"/>
    </g>
  </g>
</svg>
